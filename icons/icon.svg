    <rect x="16" y="16" width="480" height="480" fill="url(#amb)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#amb2)"/>
    <ellipse cx="150" cy="-40" rx="320" ry="170" fill="#fff" opacity=".16"/>
    <path d="M16 300c90-60 180-50 250-10s150 30 230-20v226H16z" fill="#7c5cff" opacity=".18"/>
