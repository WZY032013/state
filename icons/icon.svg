<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset=".48" stop-color="#2f9bff"/>
      <stop offset="1" stop-color="#0a64e8"/>
    </linearGradient>
    <radialGradient id="amb" cx=".12" cy=".88" r=".9">
      <stop offset="0" stop-color="#34e0a1" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#34e0a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb2" cx=".95" cy=".18" r=".75">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
