    <rect x="17.5" y="17.5" width="477" height="477" rx="114.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
  </g>

  <!-- chat bubble -->
  <path d="M148 168h216a40 40 0 0 1 40 40v96a40 40 0 0 1-40 40H268l-62 46a12 12 0 0 1-19.4-9.5V344h-38.6A40 40 0 0 1 108 304v-96a40 40 0 0 1 40-40Z" fill="url(#bubble)"/>
  <circle cx="202" cy="256" r="15" fill="#2f9bff"/>
