<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Stating — 果味液态玻璃即时通讯">
<title>Stating · 液态玻璃</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 第 1 层：被折射的背景（静态壁纸，无动画） ===== -->
  <div class="wallpaper" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="grain"></span>
  </div>

  <!-- ===== 认证层 ===== -->
  <div id="auth" class="auth-wrap" hidden>
    <div class="auth-card glass glass-strong">
      <div class="brand">
        <span class="brand-mark" id="brandMark" data-icon="chat"></span>
        <h1 class="brand-name">Stating</h1>
      </div>
      <div class="segment" role="tablist" aria-label="登录或注册">
        <button class="seg-item is-active" id="tabLogin" role="tab" aria-selected="true" data-mode="login">登录</button>
        <button class="seg-item" id="tabRegister" role="tab" aria-selected="false" data-mode="register">注册</button>
        <span class="seg-thumb" aria-hidden="true"></span>
      </div>

      <!-- 登录 -->
      <form id="loginForm" class="auth-form" novalidate>
        <label class="field">
          <span class="field-icon" data-icon="phone"></span>
          <input type="tel" name="phone" inputmode="numeric" autocomplete="tel" placeholder="手机号" maxlength="15">
        </label>
        <label class="field">
          <span class="field-icon" data-icon="lock"></span>
          <input type="password" name="password" autocomplete="current-password" placeholder="密码">
        </label>
        <label class="field admin-key" hidden>
          <span class="field-icon" data-icon="key"></span>
          <input type="password" name="adminKey" placeholder="管理员密钥">
        </label>
        <button type="submit" class="btn btn-primary btn-block" data-loading="登录中…">登录</button>
        <div class="auth-alt">
          <button type="button" class="btn-text" id="openQrLogin">扫码登录</button>
          <button type="button" class="btn-text" id="openForgot">忘记密码</button>
        </div>
      </form>

      <!-- 注册 -->
      <form id="registerForm" class="auth-form" hidden novalidate>
        <div class="avatar-pick" id="regAvatarPick" role="group" aria-label="选择头像表情"></div>
        <label class="field">
          <span class="field-icon" data-icon="phone"></span>
          <input type="tel" name="phone" inputmode="numeric" autocomplete="tel" placeholder="手机号" maxlength="15">
        </label>
        <label class="field">
          <span class="field-icon" data-icon="smiley"></span>
          <input type="text" name="nickname" autocomplete="nickname" placeholder="昵称" maxlength="20">
        </label>
        <label class="field">
          <span class="field-icon" data-icon="lock"></span>
          <input type="password" name="password" autocomplete="new-password" placeholder="密码（≥8位，含字母和数字）">
        </label>
        <label class="field">
          <span class="field-icon" data-icon="mail"></span>
          <input type="email" name="email" autocomplete="email" placeholder="邮箱（选填）">
        </label>
        <label class="field admin-key" hidden>
          <span class="field-icon" data-icon="key"></span>
          <input type="password" name="adminKey" placeholder="管理员密钥">
        </label>
        <button type="submit" class="btn btn-primary btn-block" data-loading="注册中…">创建账号</button>
        <p class="form-hint">注册即代表同意以手机号作为唯一账号，消息仅保留 30 天。</p>
      </form>
    </div>
  </div>

  <!-- ===== 应用层 ===== -->
  <div id="app" class="app" hidden>
    <!-- 顶部玻璃胶囊导航 -->
    <header class="topbar glass glass-pill">
      <button class="icon-btn room-back" id="roomBack" hidden aria-label="返回">
        <span data-icon="chevron-left"></span>
      </button>
      <div class="topbar-titles">
        <span class="topbar-title" id="topTitle">Stating</span>
        <span class="topbar-sub" id="topSub"></span>
      </div>
      <button class="icon-btn" id="topAction" aria-label="更多操作">
        <span data-icon="plus"></span>
      </button>
    </header>

    <main class="views">
      <!-- 首页 -->
      <section class="view" id="view-home" data-view="home">
        <div class="hero glass">
          <div class="hero-avatar" id="heroAvatar"></div>
          <div class="hero-text">
            <p class="hero-greet" id="heroGreet">你好</p>
            <h2 class="hero-name" id="heroName"></h2>
          </div>
        </div>
        <div class="quick glass">
          <h3 class="block-title">快捷操作</h3>
          <div class="quick-grid">
            <button class="quick-item" id="qaCreate"><span class="qi-icon" data-icon="group-new"></span><span class="qi-label">创建群聊</span></button>
            <button class="quick-item" id="qaJoin"><span class="qi-icon" data-icon="group-join"></span><span class="qi-label">加入群聊</span></button>
            <button class="quick-item" id="qaScan"><span class="qi-icon" data-icon="qrcode"></span><span class="qi-label">扫一扫</span></button>
            <button class="quick-item" id="qaFeedback"><span class="qi-icon" data-icon="star"></span><span class="qi-label">博采</span></button>
          </div>
        </div>
        <div class="glass card-pad">
          <div class="block-head">
            <h3 class="block-title">我的群聊</h3>
            <button class="btn-text" id="homeGoChat" data-icon-after="chevron-right">全部</button>
          </div>
          <div class="group-rows" id="homeGroups"></div>
        </div>
      </section>

      <!-- 聊天 -->
      <section class="view" id="view-chat" data-view="chat">
        <!-- 邀请门 -->
        <div class="chat-gate" id="chatGate">
          <div class="glass gate-card">
            <h2 class="gate-title">开始聊天</h2>
            <p class="gate-sub">输入邀请码加入群聊，或创建一个新群。</p>
            <div class="gate-row">
              <label class="field field-grow">
                <span class="field-icon" data-icon="hash"></span>
                <input type="text" id="joinCode" placeholder="邀请码" maxlength="12">
              </label>
              <button class="btn btn-primary" id="joinBtn">加入</button>
            </div>
            <button class="btn btn-ghost btn-block" id="gateCreate">创建新群聊</button>
          </div>
          <div class="glass card-pad">
            <h3 class="block-title">我的群聊</h3>
            <div class="group-rows" id="gateGroups"></div>
          </div>
        </div>

        <!-- 群房间 -->
        <div class="room" id="room" hidden>
          <div class="announce-bar" id="announceBar" hidden>
            <span data-icon="megaphone" class="announce-icon"></span>
            <p class="announce-text" id="announceText"></p>
            <button class="announce-close" id="announceClose" aria-label="关闭公告"><span data-icon="xmark"></span></button>
          </div>
          <div class="pinned-bar" id="pinnedBar" hidden>
            <span data-icon="pin" class="pinned-icon"></span>
            <button class="pinned-text" id="pinnedJump"><span class="pinned-label">置顶消息</span><span class="pinned-content" id="pinnedContent"></span></button>
            <button class="announce-close" id="pinnedClose" aria-label="取消置顶"><span data-icon="xmark"></span></button>
          </div>
          <div class="messages" id="messages" aria-live="polite"></div>
          <div class="typing" id="typing" hidden></div>

          <!-- 输入区 -->
          <div class="composer">
            <div class="composer-sheet glass glass-pill" id="composerSheet">
              <button class="icon-btn" id="plusBtn" aria-label="更多" aria-expanded="false"><span data-icon="plus"></span></button>
              <div class="composer-input">
                <textarea id="msgInput" rows="1" placeholder="iMessage" enterkeyhint="send"></textarea>
              </div>
              <button class="icon-btn mic-btn" id="micBtn" aria-label="语音"><span data-icon="mic"></span></button>
              <button class="icon-btn send-btn" id="sendBtn" hidden aria-label="发送"><span data-icon="send"></span></button>
            </div>
            <!-- 极简 + 菜单 -->
            <div class="plus-menu glass glass-menu" id="plusMenu" hidden>
              <button class="pm-item" id="pmImage"><span class="pm-icon" data-icon="photo"></span><span class="pm-label">照片</span></button>
              <button class="pm-item" id="pmCamera"><span class="pm-icon" data-icon="camera"></span><span class="pm-label">拍摄</span></button>
              <button class="pm-item" id="pmVoice"><span class="pm-icon" data-icon="waveform"></span><span class="pm-label">语音</span></button>
            </div>
            <input type="file" id="fileImage" accept="image/*" hidden>
            <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
          </div>
        </div>
      </section>

      <!-- 用户 -->
      <section class="view" id="view-users" data-view="users">
        <div class="glass card-pad">
          <label class="search-bar">
            <span data-icon="search"></span>
            <input type="search" id="userSearch" placeholder="搜索用户">
          </label>
          <div class="user-list" id="userList"></div>
        </div>
      </section>

      <!-- 我的 -->
      <section class="view" id="view-profile" data-view="profile">
        <div class="profile-hero glass">
          <div class="profile-avatar" id="profileAvatar"></div>
          <div class="profile-meta">
            <h2 id="profileName"></h2>
            <p id="profilePhone" class="tabular"></p>
          </div>
          <button class="icon-btn" id="editProfile" aria-label="编辑资料"><span data-icon="edit"></span></button>
        </div>
        <div class="setting-list glass">
          <div class="setting-row">
            <span class="setting-icon" data-icon="moon"></span>
            <span class="setting-label">深色模式</span>
            <label class="switch"><input type="checkbox" id="swDark"><span class="switch-track"><span class="switch-thumb"></span></span></label>
          </div>
          <div class="setting-row">
            <span class="setting-icon" data-icon="bell"></span>
            <span class="setting-label">消息通知</span>
            <label class="switch"><input type="checkbox" id="swNotify" checked><span class="switch-track"><span class="switch-thumb"></span></span></label>
          </div>
          <button class="setting-row" id="goFeedback">
            <span class="setting-icon" data-icon="star"></span>
            <span class="setting-label">博采 / 反馈</span>
            <span class="setting-chevron" data-icon="chevron-right"></span>
          </button>
          <button class="setting-row" id="goAbout">
            <span class="setting-icon" data-icon="info"></span>
            <span class="setting-label">关于 Stating</span>
            <span class="setting-chevron" data-icon="chevron-right"></span>
          </button>
        </div>
        <div class="setting-list glass" id="adminEntry" hidden>
          <button class="setting-row" id="goAdmin">
            <span class="setting-icon" data-icon="shield"></span>
            <span class="setting-label">管理后台</span>
            <span class="setting-chevron" data-icon="chevron-right"></span>
          </button>
        </div>
        <div class="setting-list glass">
          <button class="setting-row danger" id="logoutBtn">
            <span class="setting-icon" data-icon="logout"></span>
            <span class="setting-label">退出登录</span>
          </button>
          <button class="setting-row danger" id="deleteBtn">
            <span class="setting-icon" data-icon="trash"></span>
            <span class="setting-label">注销账号</span>
          </button>
        </div>
      </section>

      <!-- 博采 / 反馈 -->
      <section class="view" id="view-feedback" data-view="feedback">
        <div class="glass card-pad">
          <h2 class="view-title">博采</h2>
          <p class="view-sub">你的建议会让 Stating 更好，评分与留言公开可见。</p>
          <div class="rate-stars" id="rateStars" role="radiogroup" aria-label="评分"></div>
          <textarea class="feedback-input" id="feedbackText" rows="3" placeholder="写下你的建议…" maxlength="300"></textarea>
          <button class="btn btn-primary btn-block" id="submitFeedback">提交</button>
        </div>
        <div class="glass card-pad">
          <div class="block-head"><h3 class="block-title">大家的博采</h3><span class="rating-avg" id="ratingAvg"></span></div>
          <div class="feedback-list" id="feedbackList"></div>
        </div>
      </section>

      <!-- 管理后台 -->
      <section class="view" id="view-admin" data-view="admin">
        <div class="glass card-pad">
          <h2 class="view-title">管理后台</h2>
          <div class="admin-list" id="adminList"></div>
        </div>
      </section>
    </main>

    <!-- 底部玻璃标签栏 -->
    <nav class="tabbar glass glass-pill" aria-label="主导航">
      <button class="tab is-active" data-nav="home"><span data-icon="house"></span><span class="tab-label">首页</span></button>
      <button class="tab" data-nav="chat"><span data-icon="chat"></span><span class="tab-label">聊天</span></button>
      <button class="tab" data-nav="users"><span data-icon="users"></span><span class="tab-label">用户</span></button>
      <button class="tab" data-nav="profile"><span class="tab-profile" id="tabAvatar"></span><span class="tab-label">我的</span></button>
    </nav>
  </div>

  <!-- ===== 弹层 / Sheet 容器 ===== -->
  <div class="overlay-root" id="overlayRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>

  <script src="script.js" defer></script>
</body>
</html>
